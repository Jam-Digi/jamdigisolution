<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — JAM Digi Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5E00; --violet-dark: #0F0826; --violet-card: #180D38;
      --white: #FFFFFF; --white-dim: rgba(255, 255, 255, 0.75); --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--violet-dark); color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; }
    header { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(15,8,38,0.9); border-bottom: 1px solid var(--border); }
    .nav-wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 90px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; }
    .brand-logo { width: 44px; height: 44px; background: var(--orange); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: var(--white-dim); text-decoration: none; font-weight: 600; }
    .nav-links a.active { color: var(--orange); }

    .wrap { max-width: 800px; margin: 0 auto; padding: 150px 24px 80px; }
    .form-card {
      background: var(--violet-card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .form-card h1 { font-size: 36px; margin-bottom: 12px; text-align: center; }
    .form-card p { color: var(--white-dim); text-align: center; margin-bottom: 36px; }

    .field { margin-bottom: 20px; }
    .field label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--white-dim); }
    .field input, .field textarea {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; color: #fff; font-size: 15px; outline: none;
    }
    .field input:focus, .field textarea:focus { border-color: var(--orange); }
    .btn-orange {
      width: 100%; background: var(--orange); color: #fff; border: none; padding: 16px;
      border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s;
    }
    .btn-orange:hover { opacity: 0.9; }
  </style>
</head>
<body>
<header>
  <div class="nav-wrap">
    <div class="brand"><div class="brand-logo">JD</div> JAM Digi Solutions</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="work.html">Client Work</a></li>
      <li><a href="contact.html" class="active">Contact Us</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  <div class="form-card">
    <h1>Accelerate Your Growth</h1>
    <p>Fill out the form below and our growth strategy team will contact you within 24 hours.</p>
    
    <form id="contactForm">
      <div class="field">
        <label>Your Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>
      </div>
      <div class="field">
        <label>Business Name</label>
        <input type="text" id="biz" placeholder="Your company name" required>
      </div>
      <div class="field">
        <label>WhatsApp Number</label>
        <input type="tel" id="phone" placeholder="+91 XXXXX XXXXX" required>
      </div>
      <div class="field">
        <label>How can we help you grow?</label>
        <textarea id="msg" rows="4" placeholder="Tell us about your goals..."></textarea>
      </div>
      <button type="submit" class="btn-orange">Request Free Audit & Proposal</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const biz = document.getElementById('biz').value;
    const phone = document.getElementById('phone').value;
    const msg = document.getElementById('msg').value;

    const mailto = `mailto:jamdigisolutions@gmail.com?subject=New Audit Request - ${biz}&body=Name: ${name}%0ABusiness: ${biz}%0APhone: ${phone}%0AMessage: ${msg}`;
    window.location.href = mailto;
  });
</script>
</body>
</html>
