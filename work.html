<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Work — JAM Digi Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF5E00; --violet-dark: #0F0826; --violet-card: #180D38;
      --white: #FFFFFF; --white-dim: rgba(255, 255, 255, 0.75); --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--violet-dark); color: var(--white); font-family: 'Plus Jakarta Sans', sans-serif; }
    header { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(15,8,38,0.9); border-bottom: 1px solid var(--border); }
    .nav-wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 90px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; }
    .brand-logo { width: 44px; height: 44px; background: var(--orange); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: var(--white-dim); text-decoration: none; font-weight: 600; }
    .nav-links a.active { color: var(--orange); }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 150px 24px 80px; }
    .title { text-align: center; margin-bottom: 60px; }
    .title h1 { font-size: 48px; font-weight: 800; }

    .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
    .portfolio-card {
      background: var(--violet-card); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden; transition: transform 0.3s;
    }
    .portfolio-card:hover { transform: translateY(-8px); border-color: var(--orange); }
    .portfolio-card img { width: 100%; height: 300px; object-fit: cover; }
    .p-body { padding: 24px; }
    .tag { color: var(--orange); font-weight: 700; font-size: 13px; margin-bottom: 8px; display: block; }
  </style>
</head>
<body>
<header>
  <div class="nav-wrap">
    <div class="brand"><div class="brand-logo">JD</div> JAM Digi Solutions</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="work.html" class="active">Client Work</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  <div class="title">
    <h1>Our Proven Track Record</h1>
    <p style="color:var(--white-dim);">Real campaigns. Real revenue growth.</p>
  </div>

  <div class="portfolio-grid">
    <div class="portfolio-card">
      <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?auto=format&fit=crop&w=800&q=80" alt="Work 1">
      <div class="p-body">
        <span class="tag">RETAIL BRANDING & ADS</span>
        <h3>+320% Revenue Scaling for Local Chain</h3>
      </div>
    </div>
    <div class="portfolio-card">
      <img src="https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=800&q=80" alt="Work 2">
      <div class="p-body">
        <span class="tag">LEAD GENERATION</span>
        <h3>500+ Qualified Monthly Enquiries</h3>
      </div>
    </div>
  </div>
</div>
</body>
</html>
